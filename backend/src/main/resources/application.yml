server:
  port: 8080

spring:
  application:
    name: cloud-storage-backend

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/clouddb;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:cGxlYXNlLXJlcGxhY2UtdGhpcy1kZW1vLXNlY3JldC13aXRoLWEtcmVhbC1vbmU=}
    expiration-ms: 86400000

  storage:
    root: "./storage"

  cors:
    allowed-origins: "http://localhost:5173"

  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}